server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    # загрузка фото товаров и аватаров
    client_max_body_size 50m;

    # API и картинки — в контейнер backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Telegram-бот: /bot/send -> telegrambot:5001/send
    location /bot/ {
        proxy_pass http://telegrambot:5001/;
        proxy_set_header Host $host;
    }

    # собранные файлы Vite содержат хеш в имени — кешируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: все остальные пути отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

}
